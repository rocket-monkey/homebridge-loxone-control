    gap: 1rem;

    color: #ffffff;

  @media (prefers-color-scheme: dark) {

    .form-control {
      background-color: #495057;

<div id="pageIntro" class="text-center" style="display: none">
  <p class="lead">
    Thank you for installing <strong>homebridge-loxone-control</strong>
  </p>
  <p>
    You can enter your Loxone Miniserver ID, username and password on the next
    page
  </p>
  <button type="button" class="btn btn-primary" id="introContinue">
    Continue &rarr;
  </button>
</div>
<div
  id="menuWrapper"
  class="btn-group w-100 mb-0"
  role="group"
  aria-label="UI Menu"
  style="display: none"
>
  <button type="button" class="btn btn-primary ml-0" id="menuSetup">
    Setup
  </button>
  <button type="button" class="btn btn-primary" id="menuConfigured">
    Configured
  </button>
  <button type="button" class="btn btn-primary" id="menuDevices">
    Discover
  </button>
  <button type="button" class="btn btn-primary mr-0" id="menuHome">
    Advanced
  </button>
</div>

<div id="pageConfigured" class="mt-4" style="display: none">
  <div id="configuredDevicesList"></div>

  <form id="editAccessoryForm" style="display: none">
    <p id="editAccessoryTitle" class="lead"></p>
    <p id="editAccessoryIdentifier" class="small" style="word-break: break-all;"></p>
    <input type="hidden" id="editDeviceIndex" />

    <div class="form-group">
      <label for="editAccessoryName">Display name for HomeKit</label>
      <input type="text" class="form-control" id="editAccessoryName" required />
    </div>
    <div class="form-group">
      <label for="editAccessoryTypeSelect">Accessory type</label>
      <select class="form-control" id="editAccessoryTypeSelect">
        <option value="">Auto-detect</option>
        <option value="fan">Fan</option>
        <option value="light">Light</option>
        <option value="temperature">Temperature</option>
        <option value="blinds">Blinds</option>
        <option value="centralBlinds">Central Blinds (All Up/Down)</option>
        <option value="toggle">Toggle</option>
      </select>
    </div>
    <div class="form-group edit-accessory-light">
      <checkbox-widget>
        <label class="hb-uix-switch" for="editLightOutlet">
          <input type="checkbox" id="editLightOutlet" class="ng-untouched ng-pristine ng-valid" />
          <span>Should this device be handled as outlet?</span>
          <span class="hb-uix-slider hb-uix-round"></span>
        </label>
      </checkbox-widget>
    </div>
    <div class="form-group edit-accessory-fan">
      <checkbox-widget>
        <label class="hb-uix-switch" for="editFanBathroom">
          <input type="checkbox" id="editFanBathroom" class="ng-untouched ng-pristine ng-valid" />
          <span>Should this device be handled as bathroom fan?</span>
          <span class="hb-uix-slider hb-uix-round"></span>
        </label>
      </checkbox-widget>
    </div>
    <div class="form-group edit-accessory-fan">
      <label for="editFanAddButtons">Additional fan levels (comma separated)</label>
      <input type="text" class="form-control" id="editFanAddButtons" />
    </div>
    <div class="form-group edit-accessory-blinds">
      <label for="editBlindsType">Window covering type</label>
      <select class="form-control" id="editBlindsType">
        <option value="blinds">Blinds (with tilt control)</option>
        <option value="awning">Awning (no tilt)</option>
      </select>
    </div>
  </form>

  <div class="text-center edit-accessory-actions" style="display: none">
    <button id="saveEditButton" type="button" class="btn btn-primary">
      Save
    </button>
    <button id="deleteEditButton" type="button" class="btn btn-danger">
      Delete
    </button>
    <button id="cancelEditButton" type="button" class="btn btn-outline">
      Cancel
    </button>
  </div>
</div>

<div id="pageDevices" class="mt-4" style="display: none">
  <ul id="discoveredDevices"></ul>

  <form id="accessoryForm" style="display: none">
    <p id="addAccessoryTitle" class="lead"></p>
    <p id="addAccessoryType" class="small"></p>
    <p id="addAccessoryActionUuid" class="small"></p>
    <input type="hidden" id="accessoryIdentifier" />

    <div class="form-group">
      <label for="accessoryName">Display name for HomeKit</label>
      <input type="text" class="form-control" id="accessoryName" required />
    </div>
    <div class="form-group">
      <select class="form-control" id="accessoryTypeSelect">
        <option value="fan">Fan</option>
        <option value="light">Light</option>
        <option value="temperature">Temperature</option>
        <option value="blinds">Blinds</option>
        <option value="centralBlinds">Central Blinds (All Up/Down)</option>
        <option value="toggle">Toggle</option>
      </select>
    </div>
    <div class="form-group accessory-light">
      <checkbox-widget>
        <label class="hb-uix-switch" for="lightOutlet">
          <input
            type="checkbox"
            id="lightOutlet"
            class="ng-untouched ng-pristine ng-valid"
          />
          <span>Should this device be handled as outlet?</span>
          <span class="hb-uix-slider hb-uix-round"></span>
        </label>
      </checkbox-widget>
    </div>
    <div class="form-group accessory-fan">
      <checkbox-widget>
        <label class="hb-uix-switch" for="fanBathroom">
          <input
            type="checkbox"
            id="fanBathroom"
            class="ng-untouched ng-pristine ng-valid"
          />
          <span>Should this device be handled as bathroom fan?</span>
          <span class="hb-uix-slider hb-uix-round"></span>
        </label>
      </checkbox-widget>
    </div>
    <div class="form-group accessory-fan">
      <label for="fanAddButtons"
        >What additional levels should be available to set? List them coma
        separated</label
      >
      <input type="text" class="form-control" id="fanAddButtons" required />
    </div>
    <div class="form-group accessory-blinds">
      <label for="blindsType">Window covering type</label>
      <select class="form-control" id="blindsType">
        <option value="blinds">Blinds (with tilt control)</option>
        <option value="awning">Awning (no tilt)</option>
      </select>
    </div>
  </form>

  <div class="text-center accessory-actions" style="display: none">
    <button id="addAccessoryButton" type="button" class="btn btn-primary">
      Add Accessory
    </button>
    <button
      id="identifyAccessoryButton"
      type="button"
      class="btn btn-secondary"
    >
      Identify
    </button>
    <button id="cancelAccessoryButton" type="button" class="btn btn-outline">
      Cancel
    </button>
  </div>
</div>

<div id="pageAdvanced" class="mt-4" style="display: none">
  <div class="card card-body">
    <form id="advancedForm">
      <div class="form-group">
        <label for="fanLevels"
          >Levels the fan can be set to, coma separated in the format
          "index:levelName"</label
        >
        <input type="text" class="form-control" id="fanLevels" required />
      </div>
      <div class="form-group">
        <checkbox-widget>
          <label class="hb-uix-switch" for="verboseLogging">
            <input
              type="checkbox"
              id="verboseLogging"
              class="ng-untouched ng-pristine ng-valid"
            />
            <span>Verbose logging</span>
            <span class="hb-uix-slider hb-uix-round"></span>
          </label>
        </checkbox-widget>
      </div>
    </form>
  </div>
</div>

<div id="pageCredentials" style="display: none">
  <div class="card card-body">
    <form id="credentialsForm">
      <div class="form-group">
        <label for="loxoneMiniServerId">Loxone Miniserver ID</label>
        <input
          type="text"
          class="form-control"
          id="loxoneMiniServerId"
          required
        />
      </div>
      <div class="form-group">
        <label for="loxoneUser">Loxone Username</label>
        <input type="text" class="form-control" id="loxoneUser" required />
      </div>
      <div class="form-group">
        <label for="loxonePassword">Loxone Password</label>
        <input type="text" class="form-control" id="loxonePassword" required />
      </div>
      <div class="form-group">
        <label for="chromiumPath">Chromium Path</label>
        <input type="text" class="form-control" id="chromiumPath" />
      </div>
    </form>
  </div>
</div>

<script>
  const urlPrefix = `${location.protocol}//${location.hostname}:18081`;
  const allMenuButtons = ["menuSetup", "menuConfigured", "menuDevices", "menuHome"];
  const allPages = ["pageCredentials", "pageConfigured", "pageDevices", "pageAdvanced"];

  switchPage = (activeMenu, activePage) => {
    allMenuButtons.forEach((id) => {
      const el = document.getElementById(id);
      if (id === activeMenu) {
        el.classList.add("btn-elegant");
        el.classList.remove("btn-primary");
      } else {
        el.classList.remove("btn-elegant");
        el.classList.add("btn-primary");
      }
    });
    allPages.forEach((id) => {
      document.getElementById(id).style.display = id === activePage ? "block" : "none";
    });
  };

  showIntro = () => {
    const introContinue = document.getElementById("introContinue");
    introContinue.addEventListener("click", () => {
      homebridge.showSpinner();
      document.getElementById("pageIntro").style.display = "none";
      document.getElementById("menuWrapper").style.display = "inline-flex";
      showCredentials();
      homebridge.hideSpinner();
    });
    document.getElementById("pageIntro").style.display = "block";
  };

  showCredentials = () => {
    switchPage("menuSetup", "pageCredentials");
  };

  showDevices = async () => {
    try {
      homebridge.showSpinner();
      switchPage("menuDevices", "pageDevices");

      const pluginConfig = await homebridge.getPluginConfig();
      const config = pluginConfig.length ? pluginConfig[0] : {};
      if (
        !config.loxoneMiniServerId ||
        !config.loxoneUser ||
        !config.loxonePassword
      ) {
        document.querySelector("#discoveredDevices").innerHTML = `
          <li style="display: flex; align-items: center;">
            <div class="error-message" style="width: 100%;">
              <strong>Setup must be completed to unlock device discovery</strong>
            </div>
          </li>`;
        return;
      }

      const response = await fetch(`${urlPrefix}/discoverDevices`);
      const discoverDevices = await response.json();
      await renderDevices(discoverDevices);
    } catch (e) {
      homebridge.toast.error(e.error, e.message);
    } finally {
      homebridge.hideSpinner();
    }
  };

  showAdvanced = () => {
    switchPage("menuHome", "pageAdvanced");
  };

  // --- Configured Devices ---

  showConfigured = async () => {
    switchPage("menuConfigured", "pageConfigured");
    cancelEdit();
    await renderConfiguredDevices();
  };

  getDeviceTypeLabel = (device) => {
    if (device.accessoryType) {
      return device.accessoryType;
    }
    // Infer from identifier
    if (device.identifier.includes("Jalousie")) return "blinds";
    if (device.identifier.includes("Beleuchtung")) return device.lightOutlet ? "outlet" : "light";
    if (device.identifier.includes("Lüftung")) return device.fanBathroom ? "fan (bathroom)" : "fan";
    if (device.identifier.includes("Klima") || device.identifier.includes("InfoOnlyAnalog")) return "temperature";
    if (device.identifier.includes("CentralJalousie")) return "toggle";
    return "unknown";
  };

  renderConfiguredDevices = async () => {
    const pluginConfig = await homebridge.getPluginConfig();
    const devices = pluginConfig[0]?.devices ?? [];
    const listEl = document.getElementById("configuredDevicesList");

    if (devices.length === 0) {
      listEl.innerHTML = `
        <div class="error-message">
          <strong>No devices configured yet</strong>
        </div>`;
      return;
    }

    listEl.innerHTML = devices.map((device, index) => {
      const typeLabel = getDeviceTypeLabel(device);
      return `
        <div class="configured-device">
          <div class="device-info">
            <span class="device-name">${device.name}</span>
            <span class="device-type">${typeLabel}</span>
          </div>
          <div class="device-actions">
            <button type="button" class="btn btn-secondary btn-sm" onclick="editDevice(${index})">Edit</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="deleteDevice(${index})">Delete</button>
          </div>
        </div>`;
    }).join("\n");
  };

  editDevice = async (index) => {
    const pluginConfig = await homebridge.getPluginConfig();
    const device = pluginConfig[0]?.devices?.[index];
    if (!device) return;

    document.getElementById("configuredDevicesList").style.display = "none";
    document.getElementById("editAccessoryForm").style.display = "block";
    document.querySelector(".edit-accessory-actions").style.display = "block";

    document.getElementById("editAccessoryTitle").innerHTML =
      `Edit "<strong>${device.name}</strong>"`;
    document.getElementById("editAccessoryIdentifier").innerHTML =
      `Identifier: <em>${device.identifier}</em>`;
    document.getElementById("editDeviceIndex").value = index;
    document.getElementById("editAccessoryName").value = device.name;
    // Update auto-detect label to show the inferred type
    const detectedType = getDeviceTypeLabel(device);
    const autoOption = document.querySelector("#editAccessoryTypeSelect option[value='']");
    autoOption.textContent = `Auto-detect (${detectedType})`;

    document.getElementById("editAccessoryTypeSelect").value = device.accessoryType || "";

    // Populate type-specific fields
    document.getElementById("editLightOutlet").checked = Boolean(device.lightOutlet);
    document.getElementById("editFanBathroom").checked = Boolean(device.fanBathroom);
    document.getElementById("editFanAddButtons").value = device.fanAddButtons || "";
    document.getElementById("editBlindsType").value =
      device.blindsType || (device.blindsTiming?.includes("awning") ? "awning" : "blinds");

    updateEditFormState();
  };

  updateEditFormState = () => {
    let type = document.getElementById("editAccessoryTypeSelect").value;
    // When auto-detect, infer type from the auto-detect label
    if (!type) {
      const autoText = document.querySelector("#editAccessoryTypeSelect option[value='']").textContent;
      const match = autoText.match(/\((\w+)/);
      type = match ? match[1] : "";
    }
    document.querySelectorAll(".edit-accessory-light").forEach((el) => {
      el.style.display = type === "light" || type === "outlet" ? "block" : "none";
    });
    document.querySelectorAll(".edit-accessory-fan").forEach((el) => {
      el.style.display = type === "fan" ? "block" : "none";
    });
    document.querySelectorAll(".edit-accessory-blinds").forEach((el) => {
      el.style.display = type === "blinds" ? "block" : "none";
    });
  };

  saveEditDevice = async () => {
    const pluginConfig = await homebridge.getPluginConfig();
    const index = parseInt(document.getElementById("editDeviceIndex").value, 10);
    const device = pluginConfig[0]?.devices?.[index];
    if (!device) return;

    const name = document.getElementById("editAccessoryName").value;
    if (!name) {
      homebridge.toast.error("Please enter a name", "Error");
      return;
    }

    // Update base fields
    device.name = name;
    const accessoryType = document.getElementById("editAccessoryTypeSelect").value;
    if (accessoryType) {
      device.accessoryType = accessoryType;
    } else {
      delete device.accessoryType;
    }

    // Update type-specific fields
    const type = accessoryType || getDeviceTypeLabel(device);
    if (type === "light") {
      device.lightOutlet = document.getElementById("editLightOutlet").checked;
    }
    if (type === "fan") {
      device.fanBathroom = document.getElementById("editFanBathroom").checked;
      device.fanAddButtons = document.getElementById("editFanAddButtons").value || undefined;
    }
    if (type === "blinds") {
      device.blindsType = document.getElementById("editBlindsType").value;
      // Clean up legacy blindsTiming if blindsType is now set
      if (device.blindsTiming) {
        delete device.blindsTiming;
      }
      if (device.blindsMaxPosition) {
        delete device.blindsMaxPosition;
      }
    }

    await homebridge.updatePluginConfig(pluginConfig);
    homebridge.toast.success("Device updated", "Success");
    cancelEdit();
    await renderConfiguredDevices();
  };

  deleteDevice = async (index) => {
    const pluginConfig = await homebridge.getPluginConfig();
    const device = pluginConfig[0]?.devices?.[index];
    if (!device) return;

    if (!confirm(`Delete "${device.name}"?`)) return;

    pluginConfig[0].devices.splice(index, 1);
    await homebridge.updatePluginConfig(pluginConfig);
    homebridge.toast.success("Device deleted", "Success");
    cancelEdit();
    await renderConfiguredDevices();
  };

  cancelEdit = () => {
    document.getElementById("configuredDevicesList").style.display = "block";
    document.getElementById("editAccessoryForm").style.display = "none";
    document.querySelector(".edit-accessory-actions").style.display = "none";
  };

  // --- Discover Devices (existing) ---

  getTypeValueFromCategory = (category) => {
    switch (category) {
      case "Lüftung":
        return "fan";
      case "Beleuchtung":
        return "light";
      case "Klima":
        return "temperature";
      case "Beschattung":
        return "blinds";
      case "Automatikbeschattung":
        return "toggle";
      default:
        return "fan";
    }
  };
  updateAccessoryFormState = () => {
    const accessoryTypeSelect = document.getElementById(
      "accessoryTypeSelect"
    ).value;
    document.querySelectorAll(".accessory-light").forEach((el) => {
      el.style.display = accessoryTypeSelect === "light" ? "block" : "none";
    });
    document.querySelectorAll(".accessory-fan").forEach((el) => {
      el.style.display = accessoryTypeSelect === "fan" ? "block" : "none";
    });
    document.querySelectorAll(".accessory-blinds").forEach((el) => {
      el.style.display = accessoryTypeSelect === "blinds" ? "block" : "none";
    });
  };
  identifyAccessory = async (identifier) => {
    try {
      homebridge.showSpinner();
      await fetch(`${urlPrefix}/identifyAccessory?identifier=${identifier}`);
    } catch (e) {
      homebridge.toast.error(e.error, e.message);
    } finally {
      homebridge.hideSpinner();
    }
  };
  addAccessory = (identifier) => {
    document.getElementById("discoveredDevices").style.display = "none";
    document.getElementById("accessoryForm").style.display = "block";
    const [loxoneName, typeDef, actionUuid] = identifier.split(":");
    const [_, type] = typeDef.split("=");
    const parts = loxoneName.split(" ");
    const category = parts[parts.length - 1];
    document.getElementById(
      "addAccessoryTitle"
    ).innerHTML = `Add "<strong>${loxoneName}</strong>"`;
    document.getElementById(
      "addAccessoryType"
    ).innerHTML = `Type: <strong>${type}</strong>`;
    document.getElementById(
      "addAccessoryActionUuid"
    ).innerHTML = `Action UUID: <strong>${actionUuid}</strong>`;
    document.getElementById("accessoryTypeSelect").value =
      getTypeValueFromCategory(category);
    document.getElementById("accessoryName").value = "";
    document.getElementById("accessoryIdentifier").value = identifier;
    document.querySelector(".accessory-actions").style.display = "block";
    updateAccessoryFormState();
  };
  cancelAccessory = () => {
    document.getElementById("discoveredDevices").style.display = "block";
    document.getElementById("accessoryForm").style.display = "none";
    document.querySelector(".accessory-actions").style.display = "none";
  };
  renderDevices = async (allDevices) => {
    const pluginConfig = await homebridge.getPluginConfig();
    const devices = pluginConfig[0].devices ?? [];
    const cachedAccessories =
      typeof homebridge.getCachedAccessories === "function"
        ? await homebridge.getCachedAccessories()
        : await homebridge.request("/getCachedAccessories");
    if (cachedAccessories.length > 0) {
      cachedAccessories.sort((a, b) => {
        return a.displayName.toLowerCase() > b.displayName.toLowerCase()
          ? 1
          : b.displayName.toLowerCase() > a.displayName.toLowerCase()
          ? -1
          : 0;
      });
    }

    const filtered = allDevices.filter((identifier) => {
      if (identifier.includes("unknown")) return false;
      if (identifier.includes("type=Pushbutton")) return false;
      if (identifier.includes("type=TextState")) return false;

      let existingAccessory = cachedAccessories.find(
        (accessory) => accessory.context.device.identifier === identifier
      );
      let existingDeviceConfig = devices.find(
        (device) => device.identifier === identifier
      );

      if (!existingAccessory && !existingDeviceConfig) {
        const identifierParts = identifier.split(":");
        if (identifierParts.length === 3) {
          const [, typeQuery, actionUuid] = identifierParts;
          const type = typeQuery.split("=")[1];

          existingAccessory = cachedAccessories.find((accessory) => {
            const accParts = accessory.context.device.identifier.split(":");
            if (accParts.length === 3) {
              return accParts[1].split("=")[1] === type && accParts[2] === actionUuid;
            }
            return false;
          });

          existingDeviceConfig = devices.find((device) => {
            const devParts = device.identifier.split(":");
            if (devParts.length === 3) {
              return devParts[1].split("=")[1] === type && devParts[2] === actionUuid;
            }
            return false;
          });
        }
      }

      return !existingDeviceConfig && !existingAccessory;
    });

    if (filtered.length === 0) {
      document.querySelector("#discoveredDevices").innerHTML = `
        <li style="display: flex; align-items: center;">
          <div class="error-message" style="width: 100%;">
            <strong>No new devices found</strong>
          </div>
        </li>`;
      return;
    }

    document.querySelector("#discoveredDevices").innerHTML = filtered.map((identifier) => {
      const [loxoneName] = identifier.split(":");
      const canIdentify = !loxoneName.endsWith("Klima");
      const afterDot = identifier.split(" • ")[1] || identifier;
      const colonIdx = afterDot.indexOf(":type=");
      const deviceName = colonIdx > 0 ? afterDot.substring(0, colonIdx) : afterDot;
      const deviceMeta = colonIdx > 0 ? afterDot.substring(colonIdx) : "";
      return `
        <li class="button-group" style="display: flex; align-items: center; word-break: break-all;">
          <span><span style="color: #7c6cc4; font-size: 1.05em;">${deviceName}</span><span style="opacity: 0.5; font-size: 0.85em;">${deviceMeta}</span></span>
          ${canIdentify
            ? `<button type="button" class="btn btn-secondary btn-sm" onclick="identifyAccessory('${identifier}')">Identify</button>`
            : ""
          }
          <button type="button" class="btn btn-primary btn-sm" onclick="addAccessory('${identifier}')">Add</button>
        </li>`;
    }).join("\n");
  };

  // --- Init ---

  (async () => {
    try {
      const pluginConfig = await homebridge.getPluginConfig();

      if (pluginConfig.length) {
        const { loxoneMiniServerId, loxoneUser, loxonePassword, chromiumPath } =
          pluginConfig[0];
        document.getElementById("menuWrapper").style.display = "inline-flex";
        document.querySelector("#loxoneMiniServerId").value = loxoneMiniServerId ?? "";
        document.querySelector("#loxoneUser").value = loxoneUser ?? "";
        document.querySelector("#loxonePassword").value = loxonePassword ?? "";
        document.querySelector("#chromiumPath").value = chromiumPath ?? "";
        showCredentials();
      } else {
        pluginConfig.push({ name: "LoxoneControl" });
        await homebridge.updatePluginConfig(pluginConfig);
        showIntro();
      }

      const { fanLevels, verboseLogging } = pluginConfig.length ? pluginConfig[0] : {};
      document.querySelector("#fanLevels").value =
        fanLevels ?? "0:Aus;1:Stufe 1;2:Stufe 2;3:Stufe 3;4:Stufe 4;5:Hyper Speed;6:Nacht;7:Freecolling";
      document.querySelector("#verboseLogging").checked = Boolean(verboseLogging);

      document.getElementById("advancedForm").addEventListener("input", () => {
        pluginConfig[0].fanLevels = document.getElementById("fanLevels").value;
        pluginConfig[0].verboseLogging = document.getElementById("verboseLogging").checked;
        homebridge.updatePluginConfig(pluginConfig);
      });

      document.getElementById("credentialsForm").addEventListener("input", () => {
        pluginConfig[0].loxoneMiniServerId = document.getElementById("loxoneMiniServerId").value;
        pluginConfig[0].loxoneUser = document.getElementById("loxoneUser").value;
        pluginConfig[0].loxonePassword = document.getElementById("loxonePassword").value;
        pluginConfig[0].chromiumPath = document.getElementById("chromiumPath").value;
        homebridge.updatePluginConfig(pluginConfig);
      });

      // Add accessory form
      let newAccessory = {};
      document.getElementById("accessoryForm").addEventListener("input", () => {
        updateAccessoryFormState();
        const accessoryTypeSelect = document.getElementById("accessoryTypeSelect").value;
        newAccessory = {
          name: document.getElementById("accessoryName").value,
          identifier: document.getElementById("accessoryIdentifier").value,
          accessoryType: accessoryTypeSelect,
        };
        switch (accessoryTypeSelect) {
          case "fan":
            newAccessory.fanBathroom = document.getElementById("fanBathroom").checked;
            newAccessory.fanAddButtons = document.getElementById("fanAddButtons").value;
            break;
          case "blinds":
            newAccessory.blindsType = document.getElementById("blindsType").value;
            break;
          case "light":
            newAccessory.lightOutlet = document.getElementById("lightOutlet").checked;
            break;
        }
      });

      document.querySelector("#identifyAccessoryButton").addEventListener("click", () => {
        identifyAccessory(document.getElementById("accessoryIdentifier").value);
      });
      document.querySelector("#addAccessoryButton").addEventListener("click", () => {
        if (!newAccessory.name) {
          homebridge.toast.error("Please enter a name for the accessory", "Error");
          return;
        }
        pluginConfig[0].devices = pluginConfig[0].devices ?? [];
        pluginConfig[0].devices.push(newAccessory);
        homebridge.updatePluginConfig(pluginConfig);
        cancelAccessory();
        showDevices();
      });
      document.querySelector("#cancelAccessoryButton").addEventListener("click", cancelAccessory);

      // Edit form listeners
      document.getElementById("editAccessoryTypeSelect").addEventListener("change", updateEditFormState);
      document.getElementById("editAccessoryForm").addEventListener("input", updateEditFormState);
      document.querySelector("#saveEditButton").addEventListener("click", saveEditDevice);
      document.querySelector("#deleteEditButton").addEventListener("click", async () => {
        const index = parseInt(document.getElementById("editDeviceIndex").value, 10);
        await deleteDevice(index);
      });
      document.querySelector("#cancelEditButton").addEventListener("click", cancelEdit);

      // Menu navigation
      menuHome.addEventListener("click", () => showAdvanced());
      menuDevices.addEventListener("click", () => showDevices());
      menuSetup.addEventListener("click", () => showCredentials());
      menuConfigured.addEventListener("click", () => showConfigured());
    } catch (err) {
      console.error(err);
      homebridge.toast.error(err.message, "Error");
    } finally {
      homebridge.hideSpinner();
    }
  })();
</script>
